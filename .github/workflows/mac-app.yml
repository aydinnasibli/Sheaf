# Builds Sheaf on every push to main and publishes it as a GitHub release in
# this repo: Sheaf.zip to install by hand, and appcast.xml, which installed
# copies of Sheaf read to offer the update (Sparkle; see Sheaf/App/Updater.swift).
# No Apple account needed: the app is signed to run locally ("ad-hoc"), and
# each zip is signed with the EdDSA key in the SPARKLE_PRIVATE_KEY secret.
name: Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_number }}
  # The same Xcode as on the Mac Sheaf is developed on.
  XCODE_APP: /Applications/Xcode_27.2.app

jobs:
  build:
    # Only main is published; the newest release is the one to install.
    if: github.ref == 'refs/heads/main'
    # GitHub's Xcode 27 image (a preview).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          sw_vers
          echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"

      # -quiet prints only warnings, errors and failing tests. If a test
      # fails, the reasons are printed from the result bundle.
      - name: Test
        timeout-minutes: 15
        run: |
          RESULTS="$RUNNER_TEMP/Tests.xcresult"
          if ! xcodebuild -quiet -project Sheaf.xcodeproj -scheme Sheaf \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS" test; then
            xcrun xcresulttool get test-results summary --path "$RESULTS" --format json \
              | jq -r '.testFailures[]? | "\(.testIdentifierString // .testName): \(.failureText)"' || true
            exit 1
          fi

      # The build number goes into the app: Sparkle compares it to decide
      # whether a build is newer, and About Sheaf shows it.
      - name: Build release app
        run: |
          xcodebuild -quiet -project Sheaf.xcodeproj -scheme Sheaf \
            -configuration Release -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS,arch=arm64' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" build
          APP="$DERIVED_DATA/Build/Products/Release/Sheaf.app"
          codesign --verify --deep --strict "$APP"
          # ditto keeps the app's signature and symlinks intact inside the zip.
          ditto -c -k --sequesterRsrc --keepParent "$APP" Sheaf.zip
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Sign the update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "The SPARKLE_PRIVATE_KEY secret is missing: installed copies of Sheaf would reject this build."
            exit 1
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/build-$BUILD_NUMBER/Sheaf.zip"
          Scripts/make-appcast.sh "$APP" Sheaf.zip "$URL" "${NOTES:-Manual build}" \
            "$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update" > appcast.xml
          xmllint --noout appcast.xml
          cat appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          TAG="build-$BUILD_NUMBER"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already published (a re-run); nothing to do."
            exit 0
          fi
          # A re-run of an old build must not become "latest" over a newer one.
          NEWEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | sed -n 's/^build-//p' | sort -n | tail -1)
          LATEST=--latest
          if [ -n "$NEWEST" ] && [ "$NEWEST" -gt "$BUILD_NUMBER" ]; then LATEST=--latest=false; fi
          # --target: tag the commit that was built, not whatever main is now.
          # Sheaf reads appcast.xml from the newest ("latest") release.
          gh release create "$TAG" Sheaf.zip appcast.xml \
            --target "$GITHUB_SHA" \
            --title "Sheaf $VERSION (build $BUILD_NUMBER)" \
            --notes "${NOTES:-Manual build}" \
            $LATEST
          # Keep the 5 newest builds.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
